# Подключается внутрь http {} образа nginx (conf.d/default.conf) — map здесь допустим.

#! Cache-Control по итоговому URI (после try_files): хэшированные ассеты — навсегда,
#! index.html и SPA-маршруты — no-store, /api — не трогаем (пустое значение = заголовок не ставится).
map $uri $pora_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "";
    default     "no-store";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    #! Security-заголовки только на уровне server. В location'ах add_header НЕ используем:
    #! любой add_header внутри location отменяет наследование всех серверных заголовков.
    #! style-src 'unsafe-inline' — Recharts пишет inline style; для скриптов inline запрещён.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $pora_cache_control;

    #! Резолв app через Docker DNS на каждый запрос: nginx стартует, даже если бэкенд ещё
    #! не поднялся (502 вместо падения), и подхватывает новый IP после пересоздания контейнера.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pora_api http://app:5040;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # refresh-токен передаётся в query — не пишем его ни в access-, ни в error-лог
    # (ошибки апстрима уровня error содержат строку запроса).
    location /api/authorize/ {
        access_log off;
        error_log /dev/stderr crit;
        proxy_pass $pora_api;
    }

    location /api/ {
        proxy_pass $pora_api;
    }

    # Хэшированные файлы: отсутствующий — честный 404, не index.html под immutable-кэшем.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
