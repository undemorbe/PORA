name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_android_build:
        description: Skip the debug APK smoke build (release workflow builds itself)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  quality:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # .env объявлен в pubspec assets — без файла не соберётся даже тест.
      - name: Prepare .env
        env:
          API_URL: ${{ vars.API_URL }}
        run: scripts/ci/prepare_android.sh test

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Golden-эталоны сняты на macOS — на Linux растеризация шрифтов другая.
      - name: Test
        run: flutter test --coverage --exclude-tags golden

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  android-build:
    name: Android debug build
    needs: quality
    if: github.event_name == 'push' && !inputs.skip_android_build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare .env and google-services.json
        env:
          API_URL: ${{ vars.API_URL }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: scripts/ci/prepare_android.sh debug

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug
